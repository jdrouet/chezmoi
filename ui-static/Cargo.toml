[package]
name = "chezmoi-ui-static"
version = "0.1.0"
edition = "2021"

[dependencies]
another-html-builder = "0.2"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
human-number = "0.1"
plotters = { version = "0.3.7", default-features = false, features = [
    "chrono",
    "line_series",
    "svg_backend",
] }
serde = { workspace = true, features = ["derive"] }

[build-dependencies]
hex = { version = "0.4" }
sha2 = { version = "0.10" }
